name: Daily Project Generator

on:
  schedule:
    # Runs every day at 9:00 AM UTC (adjust to your timezone)
    - cron: '0 9 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  generate-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run project generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}          # Personal Access Token (NOT GITHUB_TOKEN)
          GITHUB_USERNAME: ${{ secrets.MY_GITHUB_USERNAME }}
        run: python generate_projects.py

      - name: Commit updated state file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project_state.json generator.log || true
          git diff --cached --quiet || git commit -m "chore: update state after daily run [skip ci]"
          git push
